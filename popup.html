<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #18181b;
      color: #e4e4e7;
      font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: #71717a; font-size: 11px; margin-bottom: 14px; }
    .stat {
      background: #27272a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .stat .big { font-size: 20px; font-weight: 700; color: #f43f5e; }
    .stat .label { color: #a1a1aa; font-size: 11px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .row label { color: #d4d4d8; }
    select {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 5px 8px;
      font: inherit;
    }
    input[type="checkbox"] { accent-color: #f43f5e; width: 16px; height: 16px; }
    .host { color: #fafafa; font-weight: 600; word-break: break-all; }
    .hint { color: #71717a; font-size: 10px; margin: -8px 0 12px; }
    button.snooze {
      width: 100%;
      font: 600 13px/1 -apple-system, "Segoe UI", sans-serif;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #e4e4e7;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button.snooze.active { border-color: #f59e0b; color: #fbbf24; }
    .foot { color: #52525b; font-size: 10px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>🦋 stopScrolling</h1>
  <div class="sub">Fricción contra el scroll infinito</div>

  <div class="stat">
    <div class="big" id="time-site">—</div>
    <div class="label">hoy en <span class="host" id="host">…</span></div>
    <div class="label" id="time-total"></div>
  </div>

  <button class="snooze" id="snooze">Pausar 15 min</button>

  <div class="row">
    <label for="enabled">Extensión activada</label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="row">
    <label for="intensity">Intensidad</label>
    <select id="intensity">
      <option value="suave">Suave</option>
      <option value="media">Media</option>
      <option value="dura">Dura</option>
    </select>
  </div>

  <div class="row">
    <label for="sitemode">Este sitio</label>
    <select id="sitemode">
      <option value="auto">Detección automática</option>
      <option value="always">Siempre con fricción</option>
      <option value="never">Nunca (lista blanca)</option>
    </select>
  </div>

  <div class="row">
    <label for="everywhere">Detectar feeds en cualquier web</label>
    <input type="checkbox" id="everywhere">
  </div>
  <div class="hint">Chrome te pedirá permiso para todas las webs. Sin esto, solo actúa en las redes conocidas.</div>

  <div class="foot">Los cambios se aplican al instante en todas las pestañas.</div>
  <script src="feeds.js"></script>
  <script src="popup.js"></script>
</body>
</html>
